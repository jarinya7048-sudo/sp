<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday to U</title>
  <!-- โหลด Canvas-Confetti สำหรับสร้างพลุ/กระดาษโปรย -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    /* Reset & Style พื้นฐาน */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif, system-ui;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(135deg, #6495ED 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
      overflow-y: auto; /* เปิดให้เลื่อนหน้าจอแนวตั้งได้ */
    }

    /* Container การ์ดวันเกิด */
    .card-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 450px;
      width: 100%;
      margin-top: 20px;
      margin-bottom: 40px;
      transition: all 0.3s ease;
    }

    .card-container:hover {
      transform: translateY(-5px);
    }

    h1 {
      color: #336699;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    /* สไตล์กล่องของขวัญ (Click Me) */
    .gift-box {
      font-size: 80px;
      cursor: pointer;
      margin: 20px 0;
      display: inline-block;
      transition: transform 0.2s ease;
      animation: pulse 1.5s infinite;
    }

    .gift-box:hover {
      transform: scale(1.15) rotate(5deg);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* ข้อความอวยพร */
    .message {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.6s ease-in-out;
      color: #2f3542;
      line-height: 1.6;
    }

    .message.show {
      max-height: 500px;
      opacity: 1;
      margin-top: 15px;
    }

    /* ปุ่มกดต่าง ๆ */
    .btn-action {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #3399CC;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(51, 153, 204, 0.3);
      transition: all 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }

    .btn-action:hover {
      background-color: #2b82ad;
      transform: translateY(-2px);
    }

    /* --- ส่วนแสดงรูปภาพแนวตั้ง (10 รูป) --- */
    .gallery-section {
      width: 100%;
      max-width: 350px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease-out;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 50px;
    }

    .gallery-section.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .gallery-title {
      color: #336699;
      margin-bottom: 25px;
      font-size: 1.8rem;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.7);
      text-align: center;
    }

    /* เรียงต่อกันเป็นแนวตั้ง */
    .photo-vertical-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    /* กรอบรูปโพลาลอยด์ */
    .polaroid {
      background: white;
      padding: 12px 12px 25px 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border-radius: 4px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
    }

    /* เอฟเฟกต์เอียงสลับซ้าย-ขวาให้ดูเป็นธรรมชาติ */
    .polaroid:nth-child(odd) {
      transform: rotate(-2deg);
    }
    .polaroid:nth-child(even) {
      transform: rotate(2deg);
    }

    .polaroid:hover {
      transform: scale(1.05) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }

    .polaroid img  {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 2px;
    }

    .polaroid .caption {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #57606f;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ส่วนการ์ดอวยพรหลัก -->
  <div class="card-container">
    <h1>HAPPY BIRTHDAY</h1>
    <p style="color: #747d8c;">ลองกดอิโมจิของขวัญดูสิ</p>

    <!-- กล่องของขวัญ -->
    <div class="gift-box" id="giftBox" onclick="openGift()">🎁</div>

    <!-- ข้อความอวยพร -->
    <div class="message" id="birthdayMessage">
      <h3 style="color: #3399CC; margin-bottom: 8px;">ถึง ปลื้ม MY BFF</h3>
      <p>สุขสันต์วันเกิดนะมีความสุขมากๆ ขอให้สมหวังในทุกความปราถนา มีสุขภาพที่แข็งแรง และขอบคุณที่เกิดมาบนโลกใบนี้เพื่อมาเป็นเพื่อนฉัน</p>
      
      <div style="margin-top: 15px;">
        <br>
      </div>
    </div>
  </div>

  <!-- ส่วนแสดงรูปภาพเรียงแนวตั้ง 10 รูป -->
  <div class="gallery-section" id="photos">
    
    <div class="photo-vertical-stack">
      
      <!-- รูปที่ 1 -->
      <div class="polaroid">
        <img src="S__100646918.jpg" width="500" alt="รูปที่ 1">
      </div>

      <!-- รูปที่ 2 -->
      <div class="polaroid">
        <img src="S__100646919.jpg" width="500" alt="รูปที่ 2">
      </div>

      <!-- รูปที่ 3 -->
      <div class="polaroid">
        <img src="S__100646920.jpg" width="500" alt="รูปที่ 3">
      </div>

      

        </div>

    </div>
  </div>

  <script>
    // ฟังก์ชันยิงพลุ/กระดาษโปรย (Confetti)
    function fireConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // ฟังก์ชันเปิดกล่องของขวัญ
    function openGift() {
      const giftBox = document.getElementById('giftBox');
      const message = document.getElementById('birthdayMessage');
      const gallery = document.getElementById('photos');

      // เปลี่ยนไอคอนกล่องของขวัญ และซ่อนอนิเมชันสั่น
      giftBox.innerHTML = "🦦";
      giftBox.style.animation = "none";
      
      // แสดงข้อความอวยพร
      message.classList.add('show');

      // แสดงส่วนรูปภาพแนวตั้งด้านล่าง
      gallery.classList.add('show');

      // เรียกใช้งานพลุฉลอง
      fireConfetti();
    }
  </script>
</body>
</html>
